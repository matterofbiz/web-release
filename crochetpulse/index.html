      // Gracefully handle Vite HMR WebSocket rejections in the sandboxed iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        if (reason) {
          var msg = typeof reason === 'string' ? reason : (reason.message || '');
          var stack = reason.stack || '';
          if (msg.includes('WebSocket') || msg.includes('ws') || stack.includes('@vite/client')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }
      });

        var fn = event && event.filename;
        var msg = event && event.message;
        if ((fn && fn.includes('@vite/client')) || (msg && (msg.includes('WebSocket') || msg.includes('ws')))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
